<section class="section" id="contacto">
  <div class="section-inner">
    <h2 class="section-title">¿Tienes un proyecto?</h2>
    <p class="lead">
      Estoy abierto a colaborar en arquitectura en AWS, automatización con IA o proyectos freelance.
      Escríbeme y te respondo pronto.
    </p>
    <div class="actions">
      <a class="btn btn-primary" [href]="'mailto:' + contact.email">{{ contact.email }}</a>
      <a class="btn" [href]="contact.linkedin" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</section>
